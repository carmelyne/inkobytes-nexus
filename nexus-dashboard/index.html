<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Dashboard</title>
<style>
:root {
  color-scheme: light;
  --ink: #15231f;
  --muted: #65726c;
  --paper: #f3f5f0;
  --panel: #ffffff;
  --line: #d7ded8;
  --good: #1d7f4f;
  --warn: #a85f00;
  --accent: #0e7480;
  --accent-soft: #e5f3f1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    linear-gradient(135deg, rgba(14, 116, 128, 0.10), transparent 32rem),
    radial-gradient(circle at 90% 0%, rgba(29, 127, 79, 0.10), transparent 26rem),
    var(--paper);
  color: var(--ink);
}
header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(16px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
}
h1 { margin: 0; font-size: 24px; }
h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: 0 0 auto;
}
main {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  padding: 16px;
}
section {
  grid-column: span 6;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  min-height: 160px;
  box-shadow: 0 12px 32px rgba(21, 35, 31, 0.05);
}
.wide { grid-column: span 12; }
.status { font-weight: 700; color: var(--good); }
.status.warn { color: var(--warn); }
.status-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.muted { color: var(--muted); }
.pill {
  display: inline-flex;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  color: var(--muted);
  margin: 0 6px 6px 0;
}
ul { margin: 0; padding-left: 18px; }
li { margin: 6px 0; }
dl { margin: 0; }
.feed-row {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}
.feed-row:first-child { border-top: 0; padding-top: 0; }
dt {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  margin: 0 0 4px;
  text-transform: uppercase;
}
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.feed-title { font-weight: 700; }
.feed-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.feed-icon {
  display: inline-flex;
  color: var(--muted);
  margin-right: 8px;
  vertical-align: -3px;
}
.task, .lock {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}
.task:first-child, .lock:first-child { border-top: 0; }
code { color: var(--accent); }
@media (max-width: 850px) {
  header { display: block; }
  section, .wide { grid-column: span 12; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon" data-icon="activity"></div>
    <div>
      <h1>Nexus Dashboard</h1>
      <div class="muted" id="repo">Loading repo...</div>
    </div>
  </div>
  <div>
    <div class="status-wrap"><span data-icon="circle-check"></span><div id="health" class="status">Loading</div></div>
    <div class="muted" id="updated"></div>
  </div>
</header>
<main>
  <section>
    <h2><span data-icon="lock"></span>Now</h2>
    <div id="locks"></div>
  </section>
  <section>
    <h2><span data-icon="heart-pulse"></span>Health</h2>
    <div id="health-details"></div>
  </section>
  <section class="wide">
    <h2><span data-icon="list-checks"></span>Queue</h2>
    <div id="queue"></div>
  </section>
  <section>
    <h2><span data-icon="messages-square"></span>Standup</h2>
    <dl id="standup"></dl>
  </section>
  <section>
    <h2><span data-icon="ship"></span>Recent Releases</h2>
    <dl id="releases"></dl>
  </section>
  <section class="wide">
    <h2><span data-icon="git-branch"></span>Git</h2>
    <div id="git"></div>
  </section>
</main>
<script>
async function load() {
  const data = await fetch('/api/snapshot').then(r => r.json());
  document.getElementById('repo').textContent = data.repo + ' . ' + data.branch;
  document.getElementById('updated').textContent = 'Updated ' + new Date(data.generatedAt).toLocaleTimeString();
  document.getElementById('health').textContent = data.health.ok ? 'Healthy' : 'Needs attention';
  document.getElementById('health').className = data.health.ok ? 'status' : 'status warn';
  document.querySelector('.status-wrap [data-icon]').dataset.icon = data.health.ok ? 'circle-check' : 'triangle-alert';
  renderIcons();
  document.getElementById('health-details').innerHTML = data.health.ok
    ? '<p class="muted">No core health issues.</p>'
    : '<ul>' + data.health.issues.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
  document.getElementById('locks').innerHTML = data.locks.length
    ? data.locks.map(lock => '<div class="lock"><strong>' + escapeHtml(lock.target) + '</strong><br><span class="muted">Age: ' + formatAge(lock.age) + (lock.stale ? ' . stale' : '') + '</span></div>').join('')
    : '<p class="muted">No active locks.</p>';
  document.getElementById('queue').innerHTML = data.queue.length
    ? data.queue.map(task => '<div class="task"><strong>' + escapeHtml(task.title) + '</strong><br><span class="pill">' + escapeHtml(task.agent) + '</span><span class="pill">' + escapeHtml(task.status || 'unknown') + '</span><span class="pill">auto ' + escapeHtml(task.autoFlow || 'no') + '</span><br><code>' + escapeHtml(task.files || 'no files') + '</code></div>').join('')
    : '<p class="muted">No queue tasks found.</p>';
  fillFeed('standup', data.standup);
  fillFeed('releases', data.releases);
  document.getElementById('git').innerHTML = data.dirtyFiles.length
    ? '<ul>' + data.dirtyFiles.map(file => '<li><code>' + escapeHtml(file) + '</code></li>').join('') + '</ul>'
    : '<p class="muted">Working tree clean.</p>';
}
function renderIcons() {
  const icons = {
    activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
    'circle-check': '<circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path>',
    'git-branch': '<line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path>',
    'git-commit-horizontal': '<circle cx="12" cy="12" r="3"></circle><line x1="3" x2="9" y1="12" y2="12"></line><line x1="15" x2="21" y1="12" y2="12"></line>',
    'heart-pulse': '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path><path d="M3.2 12h3l1.5-3 3 6 1.5-3h3.6"></path>',
    'list-checks': '<path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path>',
    lock: '<rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
    'messages-square': '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v10l-4-4h-6a2 2 0 0 1-2-2v-1"></path>',
    ship: '<path d="M12 10.189V14"></path><path d="M12 2v3"></path><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"></path><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"></path><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>',
    'triangle-alert': '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path>',
  };
  document.querySelectorAll('[data-icon]').forEach((node) => {
    const name = node.dataset.icon;
    node.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + (icons[name] || '') + '</svg>';
  });
}
function fillFeed(id, entries) {
  document.getElementById(id).innerHTML = entries.length
    ? entries.map(renderFeedEntry).join('')
    : '<div class="muted">No entries.</div>';
}
function renderFeedEntry(entry) {
  if (entry.type === 'Commit') {
    return '<div class="feed-row"><dd><div class="feed-title"><span class="feed-icon"><svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><line x1="3" x2="9" y1="12" y2="12"></line><line x1="15" x2="21" y1="12" y2="12"></line></svg></span>' + escapeHtml(entry.title) + '</div></dd></div>';
  }
  return '<div class="feed-row"><dt>' + escapeHtml(entry.type) + '</dt><dd><div class="feed-title">' + escapeHtml(entry.title) + '</div>' + (entry.meta ? '<div class="feed-meta">' + escapeHtml(entry.meta) + '</div>' : '') + '</dd></div>';
}
function formatAge(seconds) {
  if (seconds === null || seconds === undefined) return 'unknown';
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  return Math.floor(seconds / 3600) + 'h';
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
renderIcons();
load();
new EventSource('/events').addEventListener('update', load);
</script>
</body>
</html>
